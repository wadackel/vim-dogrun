on:
  push:
    branches: [main]
  pull_request:

name: CI

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  build_and_test:
    name: Build and Test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: generator

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Cache cargo dependencies
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: |
            ~/.rustup/toolchains/
            ~/.rustup/update-hashes/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            generator/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('generator/rust-toolchain.toml') }}-${{ hashFiles('generator/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ hashFiles('generator/rust-toolchain.toml') }}-

      - name: Show Rust version
        run: rustc --version && cargo --version

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --locked --verbose

      - name: Check generator is up-to-date
        run: |
          cargo run --locked -- -d ..
          if ! git diff --exit-code; then
            echo "Error: Generated files are not up-to-date"
            echo "Please run 'cd generator && just build' and commit the changes"
            exit 1
          fi
          untracked=$(git status --porcelain --untracked-files)
          if [ -n "$untracked" ]; then
            echo "Error: Generator produced untracked files:"
            echo "$untracked"
            exit 1
          fi
